[alembic]
# path to migration scripts
script_location = app/db/alembic

# Semicolon-separated list of supported template directories
# template_paths =

# An ini-style file is used for configuration.
# The default is alembic.ini, which is read from the current directory.
# A path may also be given, e.g. myapp:alembic.ini, where the path
# is interpreted by PasteDeploy.
# sqlalchemy.url defines the database connection.  The format is
# driver://user:pass@host/dbname.
# sqlalchemy.url = driver://user:pass@host/dbname
sqlalchemy.url = postgresql+asyncpg://user:password@postgres:5432/transactions_db

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S